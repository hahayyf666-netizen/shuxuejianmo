name: E data audit

on:
  push:
    branches:
      - audit/e-data-20260923
    paths:
      - 'tools/e_data_audit_attachment2.py'
      - 'dataset_manifest.json'
      - 'E题数据/附件2-数据集特征文件/**'
      - '.github/workflows/e-data-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/e-data-20260923
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install numpy pandas openpyxl
      - run: python tools/e_data_audit_attachment2.py
      - name: Commit audit outputs
        run: |
          git config user.name "e-data-audit"
          git config user.email "actions@users.noreply.github.com"
          git add _e_data_audit_out/attachment2_audit.json _e_data_audit_out/attachment2_audit.txt _e_data_audit_out/attachment2_label.csv
          git diff --cached --quiet || git commit -m "Add attachment 2 audit results"
          git push origin HEAD:audit/e-data-20260923
